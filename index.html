<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Multi Gamers Launcher</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>

    <div class="launcher">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <img src="assets/placeholder-logo.svg" alt="Logo">
            </div>
            <ul class="nav-links">
                <!-- Tabs will be dynamically generated here -->
            </ul>
            <div class="social-links">
                <a href="#" class="discord-btn" data-url="https://discord.gg/tqPtgyk6yT">
                    <i class="fab fa-discord"></i>
                </a>
                <a href="#" class="website-btn" data-url="https://clan-rmg.com">
                    <i class="fas fa-globe"></i>
                </a>
            </div>
        </nav>

        <!-- Window Controls -->
        <div class="window-controls">
            <button id="minimize-btn"><i class="fas fa-window-minimize"></i></button>
            <button id="maximize-btn"><i class="fas fa-window-maximize"></i></button>
            <button id="close-btn"><i class="fas fa-times"></i></button>
        </div>

        <!-- Main Content Area -->
        <main class="content">
            <!-- Tab content will be dynamically generated here -->
        </main>

        <!-- Footer -->
        <footer class="launcher-footer">
            <p>© Clan RmG .:. Royal Multi Gamers - Association sous loi 1901 .:. 2009-<span id="current-year"></span></p>
        </footer>
    </div>

    <script>
        // Set current year
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    <script src="js/app.js"></script>
</body>
</html>
